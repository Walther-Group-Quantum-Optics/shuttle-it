<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="420" viewBox="0 0 600 420">
  <title>2D fillable tea cup</title>
  <desc>
    Simple side-view tea cup for animation. The liquid surface and fill are separate,
    addressable SVG elements so the tea height and sloshing can be changed over time.
  </desc>

  <defs>
    <!-- Interior of the cup. Anything in the liquid group is clipped to this region. -->
    <clipPath id="cupInterior">
      <path d="M150 105 H410 L385 315
               Q382 340 355 340
               H205
               Q178 340 175 315 Z"/>
    </clipPath>
  </defs>

  <!-- =========================
       LIQUID
       ========================= -->
  <g id="liquid" clip-path="url(#cupInterior)">
    <!--
      Animate this path to change the tea surface.
      Current surface is flat at y = 170.
      For sloshing, replace the top edge with a line/curve, e.g.
      M140 185 Q280 145 420 180 ...
    -->
    <path id="teaFill"
          d="M140 170
             L420 170
             L420 350
             L140 350 Z"
          fill="#C77A2A"/>

    <!-- Visible surface line. Animate its path together with teaFill. -->
    <path id="teaSurface"
          d="M150 170 Q280 170 410 170"
          fill="none"
          stroke="#8A4E18"
          stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <!-- =========================
       CUP
       ========================= -->
  <!-- Cup body kept transparent so the liquid remains visible. -->
  <path id="cupBody"
        d="M145 100
           H415
           L390 316
           Q386 347 355 347
           H205
           Q174 347 170 316
           Z"
        fill="rgba(255,255,255,0.18)"
        stroke="#111111"
        stroke-width="12"
        stroke-linejoin="round"/>

  <!-- Open rim -->
  <path id="cupRim"
        d="M145 100 H415"
        fill="none"
        stroke="#111111"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Handle -->
  <path id="handleOuter"
        d="M410 150
           C500 145 510 275 421 288"
        fill="none"
        stroke="#111111"
        stroke-width="18"
        stroke-linecap="round"/>

  <path id="handleInner"
        d="M418 178
           C469 177 475 248 424 258"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"/>
</svg>
